spring.application.name=carbontrack-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/carbontrack
spring.datasource.username=carbontrack
spring.datasource.password=carbontrack_dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# Server
server.port=8080

# JWT configuration - development only. Set JWT_SECRET in deployed environments.
carbontrack.jwt.secret=${JWT_SECRET:carbontrack-dev-secret-key-32-bytes-minimum}

# HMAC secret used only to produce stable, non-identifying leaderboard aliases.
# Set LEADERBOARD_SALT to a long random secret in deployed environments.
carbontrack.leaderboard.salt=${LEADERBOARD_SALT:local-only-change-me-to-a-random-64-char-secret}

# Gemini AI assistant (optional); configure GEMINI_API_KEY only in the backend environment.
carbontrack.ai.gemini.api-key=${GEMINI_API_KEY:}
carbontrack.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
