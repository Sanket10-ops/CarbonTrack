name: Frontend CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        # The checked-in lockfile was generated on Windows and omitted Rolldown's Linux optional binding.\n        # Resolve optional platform packages on the runner instead of trusting that platform-specific lock entry.\n        run: npm install --no-package-lock --include=optional

      - name: Build frontend
        run: npm run build
